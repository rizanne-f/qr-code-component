<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>QR Code Component</title>
</head>
<body>
    <main>
        <article class="card">
            <img src="./images/image-qr-code.png" alt="QR code" class="card-image">
            <div class="card-body">
                <header>Improve your front-end skills by building projects</header>
                <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>        
            </div>
        </article>
    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="https://github.com/rizanne-f">Rizanne Fernandez</a>.
    </footer>
</body>
</html>
